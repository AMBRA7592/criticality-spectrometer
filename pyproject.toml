[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "criticality-spectrometer"
version = "0.1.1"
description = "A domain-agnostic instrument for measuring how node-removal impact changes as alternatives become available over an adaptation horizon in systems with AND/OR dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Amadeus Brandes"}]
keywords = ["dependency", "criticality", "supply-chain", "network", "resilience", "substitutability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
criticality-spectrometer = "criticality_spectrometer.cli:main"

[project.urls]
Homepage = "https://github.com/AMBRA7592/criticality-spectrometer"
Repository = "https://github.com/AMBRA7592/criticality-spectrometer"
Issues = "https://github.com/AMBRA7592/criticality-spectrometer/issues"
Changelog = "https://github.com/AMBRA7592/criticality-spectrometer/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"criticality_spectrometer" = ["py.typed"]
"criticality_spectrometer._schema" = ["*.json"]
