<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Criticality Spectrometer - text-free social preview (numerals are data, not copy) -->
  <rect width="1280" height="640" fill="#F5F4F1"/>

  <!-- gridlines: value level, zero level -->
  <line x1="240" y1="170" x2="1040" y2="170" stroke="#E5E2DA" stroke-width="1.5"/>
  <line x1="240" y1="440" x2="1040" y2="440" stroke="#E5E2DA" stroke-width="1.5"/>

  <!-- persistent -->
  <polyline points="280,170 1000,170" fill="none" stroke="#C4462B" stroke-width="6"/>
  <!-- fully adaptable -->
  <polyline points="280,170 640,440 1000,440" fill="none" stroke="#147D87" stroke-width="6"/>

  <!-- sample points -->
  <circle cx="640" cy="170" r="8" fill="#F5F4F1" stroke="#C4462B" stroke-width="4"/>
  <circle cx="1000" cy="170" r="8" fill="#F5F4F1" stroke="#C4462B" stroke-width="4"/>
  <circle cx="640" cy="440" r="8" fill="#F5F4F1" stroke="#147D87" stroke-width="4"/>
  <circle cx="1000" cy="440" r="8" fill="#F5F4F1" stroke="#147D87" stroke-width="4"/>

  <!-- the shared point -->
  <circle cx="280" cy="170" r="18" fill="none" stroke="#1E242C" stroke-width="1.5"/>
  <circle cx="280" cy="170" r="9" fill="#1E242C"/>

  <!-- horizon ticks -->
  <text x="280" y="502" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" fill="#77808B">0</text>
  <text x="640" y="502" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" fill="#77808B">12</text>
  <text x="1000" y="502" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" fill="#77808B">24</text>
</svg>
